plans: []
finding:
  model: free-public-government-data
  price: '0.00'
  currency: USD
  detail: >-
    AmeriCorps publishes NO plans and NO pricing, and this is not an omission — it is a
    federal agency publishing public-domain open data under OMB M-13-13. There is no paid
    tier, no signup, no billing relationship and no enterprise contact-sales motion for API
    access. Every one of the 534 datasets in https://data.americorps.gov/data.json is marked
    "accessLevel": "public" and is retrievable anonymously over HTTPS.
  onboarding: >-
    None required. A caller may OPTIONALLY register a free Socrata application token to raise
    throttling headroom; the token costs nothing, grants no additional data, and is not a
    plan. See authentication/americorps-authentication.yml.
  evidence:
    - url: https://data.americorps.gov/data.json
      status: 200
      detail: 534 dcat:Dataset entries, every one accessLevel "public".
    - url: https://data.americorps.gov/resource/fzpw-9z8s.json?$limit=1
      status: 200
      detail: Returned data with no credential of any kind presented.
    - url: https://data.americorps.gov/developers
      status: 404
      detail: No developer plans or pricing page exists on the portal.
    - url: https://www.americorps.gov/sitemap.xml
      status: 200
      detail: No pricing, plans, or API-tier page in the agency site's sitemap.
